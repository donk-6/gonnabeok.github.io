name: 每日财经新闻同步

# 每天 08:30 / 20:30（北京时间）拉取当日财经新闻，更新
# src/data/finance-news.json，然后重新构建并发布到 GitHub Pages。
# 工作流文件自身变更时也会跑一次，方便验证配置是否生效。
on:
  schedule:
    - cron: '30 0 * * *'   # 00:30 UTC = 08:30 北京时间
    - cron: '30 12 * * *'  # 12:30 UTC = 20:30 北京时间
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-finance-news.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    name: 同步并发布
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 拉取当日财经新闻并写入数据文件
        run: node scripts/sync-finance-news.mjs

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/finance-news.json
          if git diff --cached --quiet; then
            echo "财经数据没有变化"
          else
            git commit -m "chore: 每日财经新闻同步 $(date -u -d '+8 hours' +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          fi

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建站点
        run: pnpm build

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
